# Build filters — only the listed assets are generated/embedded from the engine.
[env]
# Every tube now generates at construction from atomic specimens, so the
# registry is unused — but an empty filter means "build all", so keep one.
#NEAMPMOD_TUBES = "ge_5y3"
#NEAMPMOD_SPEAKERS = "jensen_p12r"
#NEAMPMOD_CABINETS = "fender_5e3_open_back_1x12"

# x86-64 baseline: https://en.wikipedia.org/wiki/X86-64#Microarchitecture_levels
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
